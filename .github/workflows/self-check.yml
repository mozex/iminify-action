name: Self check

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  compress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          token: ${{ secrets.IMINIFY_TOKEN }}
          ignore: test/fixtures/
